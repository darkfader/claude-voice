# Overlay merged on top of the stock home-assistant-voice.factory.yaml
# config via custom-voice-pe.yaml's `packages:`.
#
# 1. Adds "Hey Claude" as an additional micro_wake_word model. ESPHome's
#    packages merge concatenates list values by default (old + new), so a
#    plain new list entry here is *additive* — the stock wake words (Okay
#    Nabu, Hey Jarvis, Hey Mycroft) defined upstream are untouched. Note:
#    this entry deliberately does NOT use `!extend` — `!extend` only makes
#    sense when merging onto an *existing* id, and `hey_claude` has no
#    existing entry to extend (ESPHome would raise "Source for extension of
#    ID 'hey_claude' was not found"). The local `model:` path must point at
#    the .json manifest (ESPHome's local-model validator requires a
#    filename ending in .json), not the .tflite directly — the manifest's
#    own "model" field ("hey_claude.tflite") is what actually points at the
#    tflite file, resolved relative to the manifest's directory.
#
#    Deliberately NOT setting probability_cutoff/sliding_window_size here:
#    esphome/components/micro_wake_word/__init__.py resolves both as
#    `model_parameters.get(CONF_X, manifest[KEY_MICRO][CONF_X])` — i.e. a
#    value on this YAML entry unconditionally *overrides* the manifest's
#    own tuned value, it does not merely provide a fallback default. The
#    manifest (models/hey_claude.json) already carries Task 2's real
#    FRR/FAPH-curve-derived probability_cutoff (0.5, deliberately biased
#    toward easier triggering to offset the synthetic-to-real-voice
#    generalization gap) and sliding_window_size (5). Setting either field
#    here would silently override that tuning, so the manifest is left as
#    the single source of truth for both.
#
# 2. Exposes the dial's rotation to Home Assistant by adding a `name:` to
#    the existing (upstream, internal-only) rotary_encoder sensor. This uses
#    ESPHome's real `!extend` merge syntax: the tag goes on the *value of
#    the id: field* of the list item (`id: !extend dial`), not on the
#    `sensor:` list key itself. At merge time ESPHome finds the upstream
#    list entry whose literal id is "dial" and deep-merges this item's
#    remaining fields onto it — so only `name:` is added; pins, resolution,
#    and the on_clockwise/on_anticlockwise scripts are left byte-identical
#    to upstream.
micro_wake_word:
  models:
    - model: models/hey_claude.json
      id: hey_claude

# 3. Repurposes the dial: bare rotation is now a Claude session switcher and
#    volume moves to centre-button-and-rotate.
#
#    Bare rotation fires the `esphome.claude_dial` Home Assistant event and
#    does nothing on-device. It deliberately does NOT read the rotation
#    sensor's counter any more: once volume also lives on the dial, both
#    gestures drive the same counter and are indistinguishable to a consumer
#    watching it. Delta-tracking does not rescue that either, because both
#    volume scripts end with `sensor.rotary_encoder.set_value: 0`, and a reset
#    from a nonzero value reads as a large negative delta (a spurious
#    backwards cycle). An explicit event makes the two gestures unambiguous by
#    construction and carries the direction in its payload.
#
#    Bare rotation also deliberately does NOT set `dial_touched`. That flag
#    drives `control_leds_dial_touched`, the volume-bar animation, which
#    paints over the per-session colour the ring is showing. Centre-held
#    rotation still sets it, where the bar is the correct display.
#
#    Centre-held rotation drives volume via claude_held_volume below. Upstream
#    routed that gesture to `control_hue` (or `control_group_volume` when a
#    group media player was playing); hue control is dropped on purpose, since
#    here hue means *which session* and a manually-set hue fights that.
script:
  - id: claude_held_volume
    mode: restart
    parameters:
      increase_volume: bool
    then:
      # group_volume_changed is what stops the button's RELEASE from also
      # firing the single-click action -- see the on_multi_click guard in
      # home-assistant-voice.yaml:
      #   !id(init_in_progress) && !id(color_changed) && !id(group_volume_changed)
      # Upstream's control_group_volume sets this itself; control_volume never
      # needed to, because it used to be a bare-rotation gesture. Without it,
      # every volume nudge would start the assistant or stop the music.
      - lambda: id(group_volume_changed) = true;
      - if:
          condition:
            media_player.is_playing:
              id: sendspin_group_media_player
          then:
            - script.execute:
                id: control_group_volume
                increase_volume: !lambda return increase_volume;
          else:
            - script.execute:
                id: control_volume
                increase_volume: !lambda return increase_volume;
      # 1s matches the firmware's own click window ("ON for at most 1s"), so
      # the flag outlives any release that could still register as a click.
      - delay: 1s
      - lambda: id(group_volume_changed) = false;
  # The stock idle body is replaced, not extended -- see custom-voice-pe.yaml.
  # A key cannot be both removed and assigned in the same mapping, so the
  # removal lives here (a package) and the replacement in the main config,
  # which merges after all packages. Same split the dial handlers needed.
  - id: !extend control_leds_voice_assistant_idle_phase
    then: !remove

sensor:
  - id: !extend dial
    name: "Dial Rotation"
    on_clockwise: !remove
    on_anticlockwise: !remove

# Self-reported build identity. Exists because a silent no-op build (see
# claude-voice/README.md) let two OTAs report success while the device kept
# running the previous image, with nothing in HA to contradict it. The
# compilation time is baked in at build, so this cannot lie about which
# binary is executing.
#
# `ring1` is the ring-state protocol version. Bump it whenever the encoding
# in text.claude_ring_state changes incompatibly, so the bridge can tell it
# is talking to firmware that predates the format it speaks.
text_sensor:
  - platform: template
    name: "Firmware Build"
    id: firmware_build
    entity_category: diagnostic
    icon: mdi:chip
    lambda: |-
      char build_time_buf[Application::BUILD_TIME_STR_SIZE];
      App.get_build_time_string(build_time_buf);
      return {std::string(build_time_buf) + " ring1"};
    update_interval: 60s

# Ring state, written by the PC. One group per thread, semicolons between:
#   <ringSlot>,<rrggbb>,<state>   e.g.  3,dfff00,w;7,80ff00,i
# States: i idle, w working, s selected, a attention, A arriving.
#
# A text entity rather than a stream of light calls because all animation
# runs on-device: an orbit at the strip's 66fps ceiling driven over HTTP
# would hammer Home Assistant and still stutter. The PC pushes state only
# when it changes.
#
# optimistic: true -- there is no external system of record for this value;
# the device simply accepts what it is told.
text:
  - platform: template
    name: "Claude Ring State"
    id: claude_ring_state
    optimistic: true
    min_length: 0
    max_length: 255
    mode: text
    entity_category: config
    icon: mdi:led-strip-variant
    initial_value: ""
    on_value:
      - lambda: |-
          // Parse "<slot>,<rrggbb>,<state>;..." into the ring_* globals.
          // Runs only when the value changes -- never per frame.
          const std::string &s = x;
          int n = 0;
          size_t pos = 0;
          while (pos < s.size() && n < 12) {
            size_t end = s.find(';', pos);
            if (end == std::string::npos) end = s.size();
            std::string grp = s.substr(pos, end - pos);
            pos = end + 1;

            size_t c1 = grp.find(',');
            if (c1 == std::string::npos) continue;
            size_t c2 = grp.find(',', c1 + 1);
            if (c2 == std::string::npos) continue;

            // Slot: must be non-empty and all-digit before trusting atoi().
            // atoi() silently returns 0 on non-numeric input, which would
            // otherwise alias a garbled slot field onto LED 0.
            std::string slot_str = grp.substr(0, c1);
            if (slot_str.empty()) continue;
            bool slot_digits_ok = true;
            for (char c : slot_str) {
              if (c < '0' || c > '9') { slot_digits_ok = false; break; }
            }
            if (!slot_digits_ok) continue;
            int slot = atoi(slot_str.c_str());
            if (slot < 0 || slot > 11) continue;

            // Colour: must be six hex digits before trusting strtoul().
            // strtoul() silently returns 0 (black) at the first non-hex
            // digit, which would otherwise render a corrupted colour as
            // black instead of dropping the group.
            std::string hex = grp.substr(c1 + 1, c2 - c1 - 1);
            if (hex.size() != 6) continue;
            bool hex_digits_ok = true;
            for (char c : hex) {
              bool is_hex = (c >= '0' && c <= '9') || (c >= 'a' && c <= 'f') || (c >= 'A' && c <= 'F');
              if (!is_hex) { hex_digits_ok = false; break; }
            }
            if (!hex_digits_ok) continue;

            // State: only these five codes mean anything to Task 7's
            // renderer. Anything else -- including '\0' from a group that
            // ends right after its second comma -- is dropped rather than
            // stored, so a garbled state byte can't reach the render loop.
            char st = grp[c2 + 1];
            if (st != 'i' && st != 'w' && st != 's' && st != 'a' && st != 'A') continue;

            uint32_t v = (uint32_t) strtoul(hex.c_str(), nullptr, 16);
            id(ring_slot)[n] = (uint8_t) slot;
            id(ring_r)[n] = (uint8_t) ((v >> 16) & 0xFF);
            id(ring_g)[n] = (uint8_t) ((v >> 8) & 0xFF);
            id(ring_b)[n] = (uint8_t) (v & 0xFF);

            if (st == 'A') {
              // Arrival: start the whole-ring flash and treat it as attention
              // from here on. Stored this way so no second message is needed.
              //
              // Deliberate: if a single message carries more than one 'A'
              // group, every one of those threads still correctly becomes
              // 'a', but ring_arrive_r/g/b gets overwritten each time --
              // only one whole-ring flash can play at once, so the last
              // arriving thread in the message wins the flash colour.
              id(ring_arrive_ms) = millis();
              id(ring_arrive_r) = id(ring_r)[n];
              id(ring_arrive_g) = id(ring_g)[n];
              id(ring_arrive_b) = id(ring_b)[n];
              st = 'a';
            }
            id(ring_state)[n] = st;
            n++;
          }
          id(ring_count) = n;
          ESP_LOGD("claude_ring", "parsed %d threads from '%s'", n, s.c_str());

# Globals for the per-thread ring parse (Task 6). Fixed-size, parsed once on
# text.claude_ring_state's on_value -- not per render frame -- because the
# render loop (Task 7) runs at 15ms and this device also runs wake-word
# inference; re-parsing a string 66x/sec would be wasteful and potentially
# harmful.
globals:
  - id: ring_count
    type: int
    initial_value: '0'
  - id: ring_slot
    type: uint8_t[12]
  - id: ring_r
    type: uint8_t[12]
  - id: ring_g
    type: uint8_t[12]
  - id: ring_b
    type: uint8_t[12]
  - id: ring_state
    type: char[12]
  # millis() when an arrival was last announced; 0 = no flash pending. The
  # 2s whole-ring flash is a pure function of elapsed time from here, which
  # is why arrival needs no follow-up message from the PC.
  - id: ring_arrive_ms
    type: uint32_t
    initial_value: '0'
  - id: ring_arrive_r
    type: uint8_t
    initial_value: '0'
  - id: ring_arrive_g
    type: uint8_t
    initial_value: '0'
  - id: ring_arrive_b
    type: uint8_t
    initial_value: '0'

# Ring render (Task 7). Adds one addressable_lambda effect, "Claude Threads",
# to the existing (upstream) voice_assistant_leds light. Because ESPHome's
# packages merge concatenates list values, this *appends* to that light's
# effects list -- no `!remove` needed. Not yet selected anywhere: Task 8
# wires it into control_leds' idle branch, so flashing this alone changes
# nothing about the device's current behaviour until the effect is picked by
# hand or by that later task.
light:
  - id: !extend voice_assistant_leds
    effects:
      - addressable_lambda:
          name: "Claude Threads"
          update_interval: 15ms
          lambda: |-
            const uint32_t now = millis();

            // Arrival flash: whole ring in the arriving thread's colour for
            // 2s, then fall through to the normal per-thread render. Driven
            // purely by elapsed time, so no second message is required.
            if (id(ring_arrive_ms) != 0) {
              uint32_t dt = now - id(ring_arrive_ms);
              if (dt < 2000) {
                Color c(id(ring_arrive_r), id(ring_arrive_g), id(ring_arrive_b));
                for (uint8_t i = 0; i < 12; i++) it[i] = c;
                return;
              }
              id(ring_arrive_ms) = 0;
            }

            for (uint8_t i = 0; i < 12; i++) it[i] = Color::BLACK;

            const int n = id(ring_count);
            if (n == 0) return;

            // voice_assistant_leds is a *partition* over leds_internal (see
            // home-assistant-voice.yaml): physical LEDs 7..11 map to
            // partition indices 0..4, and physical 0..6 map to partition
            // indices 5..11. So it[0] here is physical LED 7, not physical
            // LED 0. The stock "Volume Display" effect already compensates
            // for this with it[(6+i)%12], implying its own visual origin is
            // partition index 6 -- this effect starts from the same
            // assumption. RING_SLOT_OFFSET is applied at exactly the two
            // places below where a thread's wire-format slot number becomes
            // an LED index (it[]/parked[]), so if a human looks at the ring
            // and finds it rotated, correcting it is a one-number change to
            // this constant, not a redesign of the render logic.
            const uint8_t RING_SLOT_OFFSET = 6;

            // Which LEDs are parked (anything not orbiting). Orbiters skip
            // these so a moving thread never masks a stationary one.
            bool parked[12] = {false};
            for (int k = 0; k < n; k++) {
              if (id(ring_state)[k] != 'w') parked[(id(ring_slot)[k] + RING_SLOT_OFFSET) % 12] = true;
            }

            // Pass 1: orbiters, drawn first so parked dots always win a
            // contested LED even if the skip logic is off by one.
            int free_count = 0;
            for (uint8_t i = 0; i < 12; i++) if (!parked[i]) free_count++;

            if (free_count > 0) {
              // 1.5s per revolution, advanced over the free LEDs only.
              const uint32_t step = (now / 125u);   // 12 steps * 125ms = 1.5s
              int orbiter = 0;
              for (int k = 0; k < n; k++) {
                if (id(ring_state)[k] != 'w') continue;
                // Stagger multiple orbiters so they do not overlap constantly.
                int idx = (int) ((step + orbiter * 4u) % (uint32_t) free_count);
                int seen = 0;
                for (uint8_t i = 0; i < 12; i++) {
                  if (parked[i]) continue;
                  if (seen == idx) {
                    it[i] = Color(id(ring_r)[k], id(ring_g)[k], id(ring_b)[k]) * 140;
                    break;
                  }
                  seen++;
                }
                orbiter++;
              }
            }

            // Pass 2: parked threads at their home LEDs, drawn after the
            // orbiters (see above) so a stationary thread's identity
            // survives even if the skip logic is off by one.
            // Pulse for attention: 1Hz between 255 and 120. The floor is 120
            // and not lower so a pulsing thread never momentarily reads as a
            // working one (140) -- that distinction is the whole point.
            const float phase = (float) (now % 1000u) / 1000.0f;
            const uint8_t pulse = (uint8_t) (120.0f + 135.0f * (0.5f + 0.5f * cosf(phase * 6.2831853f)));

            for (int k = 0; k < n; k++) {
              const char st = id(ring_state)[k];
              if (st == 'w') continue;
              uint8_t bright;
              if (st == 'a')      bright = pulse;
              else if (st == 's') bright = 255;
              else                bright = 25;
              it[(id(ring_slot)[k] + RING_SLOT_OFFSET) % 12] = Color(id(ring_r)[k], id(ring_g)[k], id(ring_b)[k]) * bright;
            }
