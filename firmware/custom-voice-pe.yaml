# Buildable entry point for the customized Home Assistant Voice PE firmware.
#
# Packages the unmodified upstream stock factory config together with our
# overlay (additional "Hey Claude" wake word + exposing the dial's rotation
# sensor to Home Assistant). home-assistant-voice.factory.yaml is the real
# top-level buildable stock target (confirmed in Task 1) — the plain
# home-assistant-voice.yaml is a package fragment missing wifi SSID/AP and
# esp32_improv/improv_serial, and cannot compile standalone.
# Push-to-talk UDP target (claude_ptt.h / overlay.yaml's claude_ptt_hold_check).
# No secrets.yaml convention exists in this firmware tree today, so this is a
# plain substitution rather than !secret -- override host/port here with the
# desktop's actual LAN IP (needs a static assignment or a DHCP reservation;
# see docs/superpowers/specs/2026-08-02-local-voice-dictation-design.md)
# before flashing.
#
# 192.168.2.31 is the desk's current DHCP lease on Ethernet 2, not a
# reservation -- it can change on lease renewal and silently break PTT with
# no error on either end (the ESP32 will happily send UDP to a stale IP,
# and nothing listens there to say otherwise). Set a DHCP reservation for
# this host, or a static IP, and update this value to match.
substitutions:
  claude_ptt_udp_host: "192.168.2.31"
  claude_ptt_udp_port: "6056"

packages:
  upstream: !include home-assistant-voice-pe/home-assistant-voice.factory.yaml
  overlay: !include overlay.yaml

# The dial's rotation handlers live HERE, not in overlay.yaml, and the split is
# load-bearing.
#
# ESPHome merges package lists by CONCATENATION, so handlers declared in
# overlay.yaml are appended to the stock ones rather than replacing them --
# verified with `esphome config`, which showed stock control_volume/control_hue
# running first and ours second. Bare rotation would still have changed volume.
#
# `on_clockwise: !remove` in overlay.yaml strips the stock handlers (also
# verified), but a key cannot be both removed and assigned in the same mapping.
# The main config is merged AFTER all packages, so the removal lands first and
# these definitions are then added to the now-empty triggers.
#
# Behaviour: bare rotation fires esphome.claude_dial and does nothing on-device
# -- deliberately not even setting dial_touched, whose volume-bar animation
# would paint over the per-session colour on the LED ring. Centre-held rotation
# drives volume via claude_held_volume (defined in overlay.yaml), which also
# sets group_volume_changed so releasing the button does not additionally fire
# the single-click action.
sensor:
  - id: !extend dial
    on_clockwise:
      - if:
          condition:
            binary_sensor.is_off: center_button
          then:
            - homeassistant.event:
                event: esphome.claude_dial
                data:
                  direction: cw
          else:
            - lambda: id(dial_touched) = true;
            - script.execute:
                id: claude_held_volume
                increase_volume: true
    on_anticlockwise:
      - if:
          condition:
            binary_sensor.is_off: center_button
          then:
            - homeassistant.event:
                event: esphome.claude_dial
                data:
                  direction: ccw
          else:
            - lambda: id(dial_touched) = true;
            - script.execute:
                id: claude_held_volume
                increase_volume: false

# Claim the ring's IDLE branch only. Every stock state -- wake word, timer,
# volume, mute, jack, factory reset -- still preempts this, which is forced
# by the shared hardware, not a choice.
#
# The else branch is the upstream body verbatim: turn the effect layer off
# and restore whatever colour the user has set on led_ring. Losing that would
# mean the ring went dead whenever no threads existed, rather than reverting
# to how the device behaved before this feature.
script:
  - id: !extend control_leds_voice_assistant_idle_phase
    then:
      - if:
          condition:
            lambda: 'return id(ring_count) > 0;'
          then:
            - light.turn_on:
                id: voice_assistant_leds
                # Explicit 100%: without it the light keeps whatever master
                # brightness the previous branch left behind (mute floors it
                # at 0.2, not-ready sets 66%), and every per-LED value in the
                # effect gets multiplied down by it. The effect does its own
                # per-thread brightness, so the master must stay at full.
                brightness: 100%
                effect: "Claude Threads"
          else:
            - light.turn_off: voice_assistant_leds
            - if:
                condition:
                  light.is_on: led_ring
                then:
                  light.turn_on: led_ring

# Mute must not blank the thread display. Mute is an AUDIO state -- the stock
# body took the whole ring for its "Muted or Silent" indicator, which sits
# ahead of the idle phase in control_leds' chain, so muting made every thread
# disappear from the ring.
#
# Threads now keep the ring while muted. The stock indicator is still used
# when there is nothing to show, so an idle muted device looks exactly as it
# did before. Trade-off accepted deliberately: while threads are on the ring
# there is no on-ring mute indicator, and mute is read from the physical
# slider and switch.home_assistant_voice_0932b4_mute instead.
#
# NOTE: this entry joins the EXISTING `script:` list above. ESPHome's loader
# raises "Duplicate key" on a second top-level `script:` in the same file --
# unlike cross-file package merging, which concatenates.
  - id: !extend control_leds_muted_or_silent
    then:
      - if:
          condition:
            lambda: 'return id(ring_count) > 0;'
          then:
            - light.turn_on:
                id: voice_assistant_leds
                # Explicit 100%: without it the light keeps whatever master
                # brightness the previous branch left behind (mute floors it
                # at 0.2, not-ready sets 66%), and every per-LED value in the
                # effect gets multiplied down by it. The effect does its own
                # per-thread brightness, so the master must stay at full.
                brightness: 100%
                effect: "Claude Threads"
          else:
            - light.turn_on:
                brightness: !lambda return max( id(led_ring).current_values.get_brightness() , 0.2f );
                id: voice_assistant_leds
                effect: "Muted or Silent"

# Threads outrank "voice assistant not ready".
#
# Muting the mic is enough to put the assistant into the not_ready phase, and
# that phase is checked BEFORE both mute and idle -- so a muted device showed
# a permanent red "Twinkle" and the thread display never got a look in. A
# muted mic is a deliberate user choice, not a fault worth blanking a working
# display for.
#
# The stock red indicator still shows when there are no threads, so a device
# that is genuinely not ready and has nothing to display still says so.
# Deliberately NOT applied to control_leds_no_ha_connection_state: if the API
# is down our thread data is stale, and hiding that would be lying.
  - id: !extend control_leds_voice_assistant_not_ready_phase
    then:
      - if:
          condition:
            lambda: 'return id(ring_count) > 0;'
          then:
            - light.turn_on:
                id: voice_assistant_leds
                # Explicit 100%: without it the light keeps whatever master
                # brightness the previous branch left behind (mute floors it
                # at 0.2, not-ready sets 66%), and every per-LED value in the
                # effect gets multiplied down by it. The effect does its own
                # per-thread brightness, so the master must stay at full.
                brightness: 100%
                effect: "Claude Threads"
          else:
            - light.turn_on:
                brightness: 66%
                red: 1
                green: 0
                blue: 0
                id: voice_assistant_leds
                effect: "Twinkle"

# Full redefinition of center_button's on_multi_click -- removed in
# overlay.yaml (see that file's comment on this same id). Byte-for-byte
# reproduction of every upstream pattern from
# home-assistant-voice-pe/home-assistant-voice.yaml's `binary_sensor:
# center_button: on_multi_click:` block, EXCEPT Simple Click's innermost
# action.
#
# Simple Click's timer/announcement/media-pause priority chain is untouched
# -- only the final fallback (previously "start voice_assistant") changes.
# It now fires a "single_press" event on the same button_press_event entity
# double/triple/long-press already use, instead of opening HA's Assist
# pipeline. This is what actually implements "single click types
# continue/yes/okay to Claude instead of talking to Nabu" -- ha-bridge.ps1
# picks up single_press the same way it already picks up the others.
# center_button_press_sound is kept as the click's audible confirmation; the
# 300ms delay before the old voice_assistant.start: is dropped since there's
# no mic-open race to protect against anymore.
binary_sensor:
  - id: !extend center_button
    on_multi_click:
      # Simple Click:
      #   - Abort "things" in order
      #     - Timer
      #     - Announcements
      #     - Voice Assistant Pipeline run
      #     - Music
      #   - Otherwise: fire single_press for ha-bridge.ps1 to act on, if not muted.
      - timing:
          - ON for at most 1s
          - OFF for at least 0.25s
        then:
          - if:
              condition:
                lambda: return !id(init_in_progress) && !id(color_changed) && !id(group_volume_changed);
              then:
                - if:
                    condition:
                      switch.is_on: timer_ringing
                    then:
                      - switch.turn_off: timer_ringing
                    else:
                      - if:
                          condition:
                            voice_assistant.is_running:
                          then:
                            - voice_assistant.stop:
                          else:
                            - if:
                                condition:
                                  media_player.is_announcing:
                                    id: external_media_player
                                then:
                                  media_player.stop:
                                    announcement: true
                                    id: external_media_player
                                else:
                                  - if:
                                      condition:
                                        media_player.is_playing:
                                          id: external_media_player
                                      then:
                                        - media_player.pause:
                                            id: external_media_player
                                      else:
                                        - if:
                                            condition:
                                              and:
                                                - switch.is_off: master_mute_switch
                                                - not: voice_assistant.is_running
                                            then:
                                              - script.execute:
                                                  id: play_sound
                                                  priority: true
                                                  sound_file: "center_button_press_sound"
                                              - event.trigger:
                                                  id: button_press_event
                                                  event_type: "single_press"
      # Double Click
      #  . Exposed as an event entity. To be used in automations inside Home Assistant
      - timing:
          - ON for at most 1s
          - OFF for at most 0.25s
          - ON for at most 1s
          - OFF for at least 0.25s
        then:
          - if:
              condition:
                lambda: return !id(init_in_progress) && !id(color_changed) && !id(group_volume_changed);
              then:
                - script.execute:
                    id: play_sound
                    priority: false
                    sound_file: "center_button_double_press_sound"
                - event.trigger:
                    id: button_press_event
                    event_type: "double_press"
      # Triple Click
      #  . Exposed as an event entity. To be used in automations inside Home Assistant
      - timing:
          - ON for at most 1s
          - OFF for at most 0.25s
          - ON for at most 1s
          - OFF for at most 0.25s
          - ON for at most 1s
          - OFF for at least 0.25s
        then:
          - if:
              condition:
                lambda: return !id(init_in_progress) && !id(color_changed) && !id(group_volume_changed);
              then:
                - script.execute:
                    id: play_sound
                    priority: false
                    sound_file: "center_button_triple_press_sound"
                - event.trigger:
                    id: button_press_event
                    event_type: "triple_press"
      # Long Press
      #  . Exposed as an event entity. To be used in automations inside Home Assistant
      - timing:
          - ON for at least 1s
        then:
          - if:
              condition:
                lambda: return !id(init_in_progress) && !id(color_changed) && !id(group_volume_changed);
              then:
                - script.execute:
                    id: play_sound
                    priority: false
                    sound_file: "center_button_long_press_sound"
                - light.turn_off: voice_assistant_leds
                - event.trigger:
                    id: button_press_event
                    event_type: "long_press"
      # Very important do not remove. Trust me :D
      - timing:
          # H ....
          - ON for at most 0.2s
          - OFF for 0s to 2s
          - ON for at most 0.2s
          - OFF for 0s to 2s
          - ON for at most 0.2s
          - OFF for 0s to 2s
          - ON for at most 0.2s
          - OFF for 0.5s to 2s
          # A ._
          - ON for at most 0.2s
          - OFF for 0s to 2s
          - ON for 0.2s to 2s
        then:
          - if:
              condition:
                lambda: return !id(init_in_progress);
              then:
                - light.turn_on:
                    brightness: 100%
                    id: voice_assistant_leds
                    effect: "Tick"
                - script.execute:
                    id: play_sound
                    priority: true
                    sound_file: "easter_egg_tick_sound"
                - delay: 4s
                - light.turn_off: voice_assistant_leds
                - script.execute:
                    id: play_sound
                    priority: true
                    sound_file: "easter_egg_tada_sound"
                - light.turn_on:
                    brightness: 100%
                    id: voice_assistant_leds
                    effect: "Rainbow"
                - event.trigger:
                    id: button_press_event
                    event_type: "easter_egg_press"
      # Factory Reset Warning
      #  . Audible and Visible warning.
      - timing:
          - ON for at least 10s
        then:
          - if:
              condition:
                lambda: return !id(dial_touched);
              then:
                - light.turn_on:
                    brightness: 100%
                    id: voice_assistant_leds
                    effect: "Factory Reset Coming Up"
                - script.execute:
                    id: play_sound
                    priority: true
                    sound_file: "factory_reset_initiated_sound"
                - wait_until:
                    binary_sensor.is_off: center_button
                - if:
                    condition:
                      lambda: return !id(factory_reset_requested);
                    then:
                      - light.turn_off: voice_assistant_leds
                      - script.execute:
                          id: play_sound
                          priority: true
                          sound_file: "factory_reset_cancelled_sound"
      # Factory Reset Confirmed.
      #  . Audible warning to prompt user to release the button
      #  . Set factory_reset_requested to true
      - timing:
          - ON for at least 22s
        then:
          - if:
              condition:
                lambda: return !id(dial_touched);
              then:
                - script.execute:
                    id: play_sound
                    priority: true
                    sound_file: "factory_reset_confirmed_sound"
                - light.turn_on:
                    brightness: 100%
                    red: 100%
                    green: 0%
                    blue: 0%
                    id: voice_assistant_leds
                    effect: "none"
                - lambda: id(factory_reset_requested) = true;
